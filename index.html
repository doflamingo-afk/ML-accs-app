<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ML Accs TikTok Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Section - TikTok UI 100% */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; color: white; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        #mainFeed { width: 100%; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        #mainFeed::-webkit-scrollbar { display: none; }

        .post-container { width: 100vw; height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        .post-media { width: 100%; height: 100%; object-fit: contain; }

        /* Sidebar Icons */
        .post-sidebar { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .action-item { margin-bottom: 18px; text-align: center; cursor: pointer; }
        .action-item i { font-size: 32px; color: white; filter: drop-shadow(0 0 3px rgba(0,0,0,0.7)); }
        .action-item span { font-size: 13px; display: block; margin-top: 4px; font-weight: 600; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .profile-pic { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; margin-bottom: 25px; position: relative; }
        .follow-plus { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: #fe2c55; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        /* Footer Info */
        .post-footer { position: absolute; bottom: 80px; left: 15px; width: 75%; text-shadow: 1px 1px 4px rgba(0,0,0,1); z-index: 10; }
        .post-footer h4 { margin: 0 0 8px 0; font-size: 18px; color: white; }
        .post-footer p { margin: 0 0 10px 0; font-size: 15px; line-height: 1.4; color: #eee; }
        .post-footer .price-tag { background: rgba(254, 44, 85, 0.9); padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 17px; display: inline-block; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: black; border-top: 0.5px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: #8a8a8e; text-align: center; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item.active { color: white; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-plus-btn { background: linear-gradient(to right, #00f2ea, #fe2c55); width: 45px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: black; font-size: 18px; margin: 0 auto; }

        /* Upload Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; padding: 25px; }
        .modal-content { background: #222; padding: 20px; border-radius: 12px; margin-top: 50px; }
        .modal-content h2 { margin-top: 0; text-align: center; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: white; font-size: 16px; }
        .post-btn { width: 100%; padding: 15px; background: #fe2c55; border: none; color: white; font-weight: bold; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .cancel-btn { width: 100%; padding: 10px; background: none; border: none; color: #aaa; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="mainFeed">
        </div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house"></i><p>Home</p></div>
        <div class="nav-item"><i class="fa-solid fa-compass"></i><p>Discover</p></div>
        <div class="nav-item" onclick="toggleUpload()"><div class="nav-plus-btn"><i class="fa-solid fa-plus"></i></div></div>
        <div class="nav-item"><i class="fa-solid fa-message"></i><p>Inbox</p></div>
        <div class="nav-item"><i class="fa-solid fa-user"></i><p>Profile</p></div>
    </nav>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h2>Sell Account</h2>
            <input type="file" id="fileInput" accept="image/*">
            <input type="text" id="accPrice" placeholder="Price (e.g. 35000 MMK)">
            <textarea id="accDesc" rows="4" placeholder="Acc details (Hero, Skin, etc...)"></textarea>
            <button onclick="uploadPost()" class="post-btn">POST NOW</button>
            <button onclick="toggleUpload()" class="cancel-btn">CLOSE</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // JS Section - All Logic Integrated
        const firebaseConfig = {
            apiKey: "AIzaSyCe2a9KNIlSpPqX1chHfVeGzVR2xcMWu88",
            authDomain: "ml-accs-29667.firebaseapp.com",
            databaseURL: "https://ml-accs-29667-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ml-accs-29667",
            storageBucket: "ml-accs-29667.firebasestorage.app",
            messagingSenderId: "596259472222",
            appId: "1:596259472222:web:e058877daff664fb2285cf"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const IMGBB_KEY = '7a311d3c3f79a9940ee3a577c46fefea';

        async function loadPosts() {
            const feed = document.getElementById('mainFeed');
            const snapshot = await db.collection('posts').orderBy('timestamp', 'desc').get();
            feed.innerHTML = '';

            snapshot.forEach(doc => {
                const post = doc.data();
                const id = doc.id;
                feed.innerHTML += `
                    <div class="post-container">
                        <img src="${post.imageUrl}" class="post-media">
                        <div class="post-sidebar">
                            <div class="profile-pic">
                                <img src="https://i.pravatar.cc/100?u=${id}" style="width:100%; height:100%; border-radius:50%;">
                                <div class="follow-plus"><i class="fa-solid fa-plus"></i></div>
                            </div>
                            <div class="action-item" onclick="likePost('${id}')">
                                <i class="fa-solid fa-heart" id="heart-${id}"></i>
                                <span>${post.likes || 0}</span>
                            </div>
                            <div class="action-item"><i class="fa-solid fa-comment-dots"></i><span>0</span></div>
                            <div class="action-item"><i class="fa-solid fa-bookmark"></i><span>0</span></div>
                            <div class="action-item" onclick="sharePost('${post.imageUrl}')"><i class="fa-solid fa-share"></i><span>Share</span></div>
                        </div>
                        <div class="post-footer">
                            <h4>@ml_seller_pro</h4>
                            <p>${post.description}</p>
                            <div class="price-tag">${post.price}</div>
                        </div>
                    </div>`;
            });
        }

        async function likePost(id) {
            const heart = document.getElementById(`heart-${id}`);
            heart.style.color = '#fe2c55';
            await db.collection('posts').doc(id).update({ likes: firebase.firestore.FieldValue.increment(1) });
            let countSpan = heart.nextElementSibling;
            countSpan.innerText = parseInt(countSpan.innerText) + 1;
        }

        function sharePost(url) {
            navigator.clipboard.writeText(url);
            alert("Link Copied!");
        }

        function toggleUpload() {
            const m = document.getElementById('uploadModal');
            m.style.display = (m.style.display === 'none' || m.style.display === '') ? 'block' : 'none';
        }

        async function uploadPost() {
            const price = document.getElementById('accPrice').value;
            const desc = document.getElementById('accDesc').value;
            const file = document.getElementById('fileInput').files[0];
            if(!price || !desc || !file) return alert("Fill all info!");

            alert("Uploading...");
            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
                const data = await res.json();
                await db.collection('posts').add({
                    imageUrl: data.data.url,
                    price: price,
                    description: desc,
                    likes: 0,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                location.reload();
            } catch (e) { alert("Error: " + e.message); }
        }

        loadPosts();
    </script>
</body>
</html>
