<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ML Accs TikTok</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div id="mainFeed"></div>

        <nav class="bottom-nav">
            <div class="nav-item active"><i class="fa-solid fa-house"></i><p>Home</p></div>
            <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><p>Discover</p></div>
            <div class="nav-plus" id="plusBtn"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item"><i class="fa-solid fa-message"></i><p>Inbox</p></div>
            <div class="nav-item"><i class="fa-solid fa-user"></i><p>Profile</p></div>
        </nav>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h2>Post New Account</h2>
            <input type="file" id="fileInput" accept="image/*">
            <input type="text" id="accPrice" placeholder="Price (MMK)">
            <textarea id="accDesc" placeholder="Account Details..."></textarea>
            <button onclick="uploadPost()" class="post-btn">POST NOW</button>
            <button onclick="toggleUpload()" class="cancel-btn">CANCEL</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
