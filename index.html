<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ML Accs APK - TikTok Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="feed" id="mainFeed">
            </div>

        <div class="side-bar">
            <div class="user-profile">
                <img src="https://i.pravatar.cc/100" id="userAvatar">
                <div class="plus">+</div>
            </div>
            <div class="action-item"><i class="fa-solid fa-heart"></i><span id="likeCount">0</span></div>
            <div class="action-item"><i class="fa-solid fa-comment"></i><span>0</span></div>
            <div class="action-item"><i class="fa-solid fa-bookmark"></i><span>0</span></div>
            <div id="buyBtnContainer"></div> <div class="action-item share-btn"><i class="fa-solid fa-share"></i><span>0</span></div>
            <div class="music-disc"><img src="https://www.pngall.com/wp-content/uploads/2/Vinyl-Record-PNG-Transparent-HD-Photo.png"></div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active"><i class="fa-solid fa-house"></i><p>Home</p></div>
            <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><p>Discover</p></div>
            <div class="nav-item post-plus"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item" onclick="openInbox()"><i class="fa-solid fa-message"></i><p>Inbox</p></div>
            <div class="nav-item" onclick="openProfile()"><i class="fa-solid fa-user"></i><p>Profile</p></div>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
