<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ML Accs APK - TikTok Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="feed" id="mainFeed">
            </div>

        <div class="side-bar">
            <div class="user-profile">
                <img src="https://i.pravatar.cc/100" id="userAvatar">
                <div class="plus">+</div>
            </div>
            <div class="action-item"><i class="fa-solid fa-heart"></i><span id="likeCount">0</span></div>
            <div class="action-item"><i class="fa-solid fa-comment"></i><span>0</span></div>
            <div class="action-item"><i class="fa-solid fa-bookmark"></i><span>0</span></div>
            <div id="buyBtnContainer"></div> 
            <div class="action-item share-btn"><i class="fa-solid fa-share"></i><span>0</span></div>
            <div class="music-disc"><img src="https://www.pngall.com/wp-content/uploads/2/Vinyl-Record-PNG-Transparent-HD-Photo.png"></div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active"><i class="fa-solid fa-house"></i><p>Home</p></div>
            <div class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><p>Discover</p></div>
            <div class="nav-item post-plus" id="plusBtn"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item" onclick="openInbox()"><i class="fa-solid fa-message"></i><p>Inbox</p></div>
            <div class="nav-item" onclick="openProfile()"><i class="fa-solid fa-user"></i><p>Profile</p></div>
        </nav>
    </div>

    <div id="uploadModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; padding:20px; color:white; overflow-y:auto;">
        <h2 style="text-align:center;">Post New Account</h2>
        <p>Upload Images (Max 10)</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="margin-bottom:20px;">
        
        <input type="text" id="accPrice" placeholder="Price (e.g. 50,000 MMK)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:none; color: black;">
        
        <textarea id="accDesc" placeholder="Account Description (Skins, Rank, etc.)" style="width:100%; height:100px; padding:10px; margin-bottom:20px; border-radius:5px; border:none; color: black;"></textarea>
        
        <button onclick="uploadPost()" style="width:100%; padding:15px; background:#fe2c55; border:none; color:white; border-radius:5px; font-weight:bold;">POST NOW</button>
        <button onclick="toggleUpload()" style="width:100%; padding:10px; background:transparent; border:1px solid white; color:white; border-radius:5px; margin-top:10px;">CANCEL</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
